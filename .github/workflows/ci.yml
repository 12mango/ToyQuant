name: build-and-test

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same two things the deploy's verify job does, for the same reason: `-j "$(nproc)"` uses all four vCPUs the
      # hosted runner has, and the compiler cache turns a re-run of an unchanged tree into link-only work.
      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ccache

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'src/**', 'tests/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure
        env:
          CCACHE_DIR: ~/.ccache
        run: cmake --preset linux-debug -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        env:
          CCACHE_DIR: ~/.ccache
        run: |
          echo "vCPUs: $(nproc)"
          ccache --zero-stats || true
          cmake --build out/build/linux-debug -j "$(nproc)"
          ccache --show-stats || true

      - name: Unit tests
        run: ctest --test-dir out/build/linux-debug --output-on-failure

      # The two checks that need no market data. The replay tiers of tools/gate/verify_l2.sh read a 1.5 GB depth
      # file that is not in the repository, so they stay local; everything that can run on source alone runs
      # here, which is the part that catches a stale flag, a missing tool path or a summary field that
      # nothing computes.
      - name: Every summary field is written
        run: python3 tools/gate/check_written_fields.py

      - name: Every documented flag, queue model and tool path exists
        run: |
          python3 tools/gate/lint_prose.py docs

      - name: Every link and anchor resolves
        run: python3 tools/gate/check_links.py

      # The publication boundary: no secret, machine path or private file is tracked, and the deny-list's audit section
      # is printed so the count of what is still public is visible on every CI run. It needs no market data.
      - name: Nothing private is tracked
        run: python3 tools/gate/check_leaks.py

      # The deploy's own invariants, and the reason this file carries them: every deploy failure so far was two files in
      # this repository disagreeing -- a name the relay reads and the template does not define, an endpoint the engine
      # dials and a listener that is elsewhere, a unit that starts before its dependency, a directory the operator owns
      # and the service cannot read. None of them needed a host to see, and all of them cost a round trip.
      - name: The deploy's invariants
        run: |
          python3 tools/gate/check_deploy.py --self-test
          python3 tools/gate/check_deploy.py

      # The deploy's own scripts are shell, and a shell script that only runs on the operator's machine is a script that
      # has never been read. `bash -n` is a parse, not a test, but it is the one check a hosted runner can run.
      - name: The deploy scripts parse
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          test -f deploy/logrotate/toyquant

      # The decision records keep one fact in two places, the record's status line and the index table. It needs no
      # market data, so it runs here as well as in the local gate: a superseded decision that never said so is a
      # documentation drift, which is the class this workflow exists to catch.
      - name: Every decision record agrees with the index
        run: python3 tools/gate/check_adr.py

