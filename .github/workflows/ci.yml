name: build-and-test

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset linux-debug

      - name: Build
        run: cmake --build out/build/linux-debug -j 2

      - name: Unit tests
        run: ctest --test-dir out/build/linux-debug --output-on-failure

      # The two checks that need no market data. The replay tiers of tools/gate/verify_l2.sh read a 1.5 GB depth
      # file that is not in the repository, so they stay local; everything that can run on source alone runs
      # here, which is the part that catches a stale flag, a missing tool path or a summary field that
      # nothing computes.
      - name: Every summary field is written
        run: python3 tools/gate/check_written_fields.py

      - name: Every documented flag, queue model and tool path exists
        run: |
          python3 tools/gate/lint_prose.py docs

      - name: Every link and anchor resolves
        run: python3 tools/gate/check_links.py

      # The decision records keep one fact in two places, the record's status line and the index table. It needs no
      # market data, so it runs here as well as in the local gate: a superseded decision that never said so is a
      # documentation drift, which is the class this workflow exists to catch.
      - name: Every decision record agrees with the index
        run: python3 tools/gate/check_adr.py
