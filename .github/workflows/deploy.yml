name: deploy

# A draft, and deliberately the narrowest trigger that can work: a tag or a hand dispatch, never a push to main. A deploy
# restarts a live session, so it is an action somebody takes rather than a consequence of a merge.
on:
  workflow_dispatch:
    inputs:
      data_gate:
        description: run the data-backed gate on the self-hosted runner (needs the archive)
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  # Two deploys at once would send two SIGTERMs to one session and race two copies of the binary onto the host.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # `linux-relwithdebinfo` is the artifact a session runs: the debug build is what the gate judges on a developer's
  # machine, and shipping it would make the deploy's performance unrepresentative.
  BUILD_PRESET: linux-relwithdebinfo
  BUILD_DIR: out/build/linux-relwithdebinfo

jobs:
  # The checks that need no market data -- the same set the repository's CI runs -- plus the two self-tests the live path
  # owns. The tier that would also run `verify_l2.sh fast` reads a 1.5 GB depth archive that is not in the repository, so it
  # runs in `data-gate` below, on the machine that holds the archive.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The compiler cache is what makes the second run of a change cheap: a build of 149 edges recompiles what the
      # previous run already compiled from identical input, and the unchanged translation units are most of them. The
      # key carries the source hash so a source change still recompiles, and the prefix restores the nearest older cache
      # as a starting point -- ccache itself decides per file, so a partial restore is not a stale binary.
      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ccache

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'src/**', 'tests/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure
        env:
          CCACHE_DIR: ~/.ccache
        run: cmake --preset ${{ env.BUILD_PRESET }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # `-j "$(nproc)"` rather than `-j 2`: the hosted runner has four vCPUs and half of them were idle, which is the
      # difference between a two-minute build and a one-minute one. The count is printed so a change in the runner's
      # size is visible in the log rather than inferred from a stopwatch.
      - name: Build
        env:
          CCACHE_DIR: ~/.ccache
        run: |
          echo "vCPUs: $(nproc)"
          ccache --zero-stats || true
          cmake --build ${{ env.BUILD_DIR }} -j "$(nproc)"
          ccache --show-stats || true

      - name: Unit tests
        run: ctest --test-dir ${{ env.BUILD_DIR }} --output-on-failure

      - name: Every summary field is written
        run: python3 tools/gate/check_written_fields.py

      - name: Every documented flag, queue model and tool path exists
        run: python3 tools/gate/lint_prose.py docs

      - name: Every link and anchor resolves
        run: python3 tools/gate/check_links.py

      - name: Every decision record agrees with the index
        run: python3 tools/gate/check_adr.py

      # The publication boundary runs before anything is shipped, not after: a deploy is the moment a tracked secret
      # would reach a host *and* a public history, and the check is the last one that can see every tracked file at once.
      - name: Nothing private is tracked
        run: python3 tools/gate/check_leaks.py

      # The deploy's own scripts are shell, and a shell script that only runs on the operator's machine is a script that
      # has never been read. `bash -n` is a parse, not a test, but it is the one check a hosted runner can run. The
      # invariants beside it are the ones a host discovers the hard way -- an env name the relay reads and the template
      # does not define, an endpoint the engine dials and a listener elsewhere, a unit before its dependency.
      - name: The deploy scripts parse and agree with each other
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          test -f deploy/logrotate/toyquant
          python3 tools/gate/check_deploy.py --self-test
          python3 tools/gate/check_deploy.py

      # The artifact a session runs is built here, once, and started here: a binary that cannot print its own help is a
      # binary the host will crash-loop on, and the first deploy proved it (SIGILL from a `-march=native` build whose
      # instructions the host's vCPU did not have). `linux-relwithdebinfo` therefore builds for the x86-64-v2 baseline,
      # and this step refuses a bundle whose program does not start.
      - name: The shipped binary starts
        run: |
          set -euo pipefail
          for binary in out/build/${{ env.BUILD_PRESET }}/toy_quant out/build/${{ env.BUILD_PRESET }}/l2_strategy_test; do
            test -x "$binary" || { echo "missing $binary"; exit 1; }
            "$binary" --help > /dev/null 2>&1 || { echo "$binary does not start"; exit 1; }
          done
          readelf -h out/build/${{ env.BUILD_PRESET }}/toy_quant | grep -q 'X86-64' || { echo "not an x86-64 binary"; exit 1; }

      # The config template is a contract (an unknown key is refused, never dropped) and the relay's shutdown machine is
      # what keeps a restart from leaving an orphan order.
      - name: The live config and the relay's shutdown machine
        run: |
          python3 tools/live/live_config.py --self-test
          python3 tools/live/venue_relay.py --self-test

      # The program travels as a tar, not as a bare file: `upload-artifact` zips, and a zip does not carry the
      # executable bit, so a downloaded `toy_quant` arrives 0644 and the host's bundle is a program nobody can run.
      # With it here rather than rebuilt below, the deploy job stops compiling the same 149 edges a second time --
      # a build whose 68 program edges it already has and whose 81 test edges it never ships.
      - name: Keep the shipped program
        run: |
          set -euo pipefail
          mkdir -p out
          tar -C "${{ env.BUILD_DIR }}" -czf "out/toy_quant-${{ env.BUILD_PRESET }}.tar.gz" toy_quant
          sha256sum out/toy_quant-*.tar.gz

      - name: Upload the program
        uses: actions/upload-artifact@v4
        with:
          name: toy-quant-program
          path: out/toy_quant-${{ env.BUILD_PRESET }}.tar.gz
          retention-days: 14

  # The data-backed gate, on a runner that holds the archive. Opt-in twice: the dispatch input asks for it, and the
  # repository variable `TOYQUANT_DATA_RUNNER=yes` says such a runner is registered. Without the second condition, a
  # dispatch that ticks the box queues this job on a label nothing serves -- measured 2026-11-27, deploy #8: `deploy`
  # finished green and `data-gate` sat at "Waiting for a runner to pick up this job" for the rest of the day. A skipped
  # job says "no runner is registered" instead.
  data-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.data_gate && vars.TOYQUANT_DATA_RUNNER == 'yes'
    runs-on: [self-hosted, toyquant-data]
    steps:
      - uses: actions/checkout@v4

      - name: The full local gate, fast tier
        run: |
          cmake --preset linux-debug
          cmake --build out/build/linux-debug -j "$(nproc)"
          bash tools/gate/verify_l2.sh fast

  deploy:
    needs: [verify]
    # A tag push and a dispatch both reach here; a pull request never does.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # No configure and no build: the program this job ships is the one `verify` already built, tested and started.
      # It arrives as a tar so the mode survives, and `test -x` is the one check worth repeating -- a tar that lost its
      # bit is caught here rather than on the host.
      - name: The program the verify job built
        uses: actions/download-artifact@v4
        with:
          name: toy-quant-program
          path: out

      - name: Unpack it where the packaging step looks for it
        run: |
          set -euo pipefail
          mkdir -p "${{ env.BUILD_DIR }}"
          tar -C "${{ env.BUILD_DIR }}" -xzf "out/toy_quant-${{ env.BUILD_PRESET }}.tar.gz"
          test -x "${{ env.BUILD_DIR }}/toy_quant" || { echo "the artifact is not executable"; exit 1; }
          "${{ env.BUILD_DIR }}/toy_quant" --help > /dev/null || { echo "the artifact does not start"; exit 1; }
          sha256sum "${{ env.BUILD_DIR }}/toy_quant"

      # What travels: the binary, the tools the live path runs, the deploy unit and the two templates. Nothing from
      # `data/`, and no `config/live.yaml` -- a deploy never carries a symbol list or a key, which is the point of the two
      # ignored files.
      - name: Package
        run: |
          set -euo pipefail
          staging=out/deploy
          rm -rf "$staging"
          mkdir -p "$staging/tools/live" "$staging/deploy/logrotate" "$staging/deploy/journald" "$staging/config"
          install -m 0755 "${{ env.BUILD_DIR }}/toy_quant" "$staging/toy_quant"
          install -m 0644 tools/live/venue_relay.py tools/live/live_config.py tools/live/okx_probe.py "$staging/tools/live/"
          install -m 0644 deploy/toyquant-live.service deploy/toyquant-relay.service deploy/toyquant-notify@.service \
            deploy/toyquant-report.service deploy/toyquant-report.timer \
            deploy/toyquant-window-start.timer deploy/toyquant-window-stop.service \
            deploy/toyquant-window-stop.timer "$staging/deploy/"
          install -m 0755 deploy/bootstrap_server.sh deploy/check_health.sh deploy/rollback.sh deploy/preflight.sh \
            deploy/wait_for_ports.sh deploy/activate.sh "$staging/deploy/"
          install -m 0755 deploy/notify.py deploy/daily_report.py "$staging/deploy/"
          install -m 0644 deploy/notify.env.example "$staging/deploy/"
          install -m 0644 deploy/journald/toyquant.conf "$staging/deploy/journald/"
          install -m 0644 deploy/logrotate/toyquant "$staging/deploy/logrotate/"
          install -m 0644 config/live.example.yaml "$staging/config/"
          install -m 0644 .env.example "$staging/"
          tar -C "$staging" -czf out/toyquant-deploy.tar.gz .
          sha256sum out/toyquant-deploy.tar.gz

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: toyquant-deploy
          path: out/toyquant-deploy.tar.gz
          retention-days: 14

      # The host, the user and the key are GitHub Secrets: nothing about the server is a repository fact, and a public
      # repository naming its own SSH user is a repository telling every reader where to try.
      - name: Install the key
        run: |
          set -euo pipefail
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > "$HOME/.ssh/deploy_key"
          chmod 0600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Copy the bundle
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/deploy_key" -o BatchMode=yes \
            out/toyquant-deploy.tar.gz \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/toyquant-deploy.tar.gz"

      # The restart is the one step with a claim in it: the engine answers SIGTERM by cancelling what it holds and only then
      # leaving, and the unit waits twelve seconds for that. The step fails if the service does not come back, and the
      # health check after it fails if the process came back wrong -- two sessions, an error in the journal, a missing
      # credential file. The running binary is copied aside first, so `deploy/rollback.sh` is one command on the host.
      - name: Unpack, verify and leave the session alone
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
             # **Cut 1 of the deploy card, first half: the latch is read before anything is written.** A release this host
             # has already rolled back from is not re-dispatched unchanged -- a revert that is immediately re-deployed is a
             # loop with extra steps (`.clinerules`) -- so the refusal happens here, before the mkdir, the tar or the
             # bootstrap, and exits 2: nothing on the host changes.
             if [ -f /opt/toyquant/data/runtime/reverted_release ]; then
               refused=$(cut -d' ' -f1 /opt/toyquant/data/runtime/reverted_release)
               if [ "$refused" = "${{ github.sha }}" ]; then
                 echo "reverted <$refused> is already on this host's latch; a third dispatch of the same release is a change, not a retry" >&2
                 exit 2
               fi
               echo "deploy: reverted_release names ${refused}, which is not this release (${{ github.sha }}); carrying on"
             fi
             sudo mkdir -p /opt/toyquant
             if [ -x /opt/toyquant/toy_quant ]; then
               sudo cp -a /opt/toyquant/toy_quant /opt/toyquant/toy_quant.prev
             fi
             sudo tar -xzf /tmp/toyquant-deploy.tar.gz -C /opt/toyquant
             # The release's name, beside the program: `activate.sh` hands it to `rollback.sh`, which writes it into the
             # latch the check above reads, so both halves compare like with like.
             printf '%s\n' "${{ github.sha }}" | sudo tee /opt/toyquant/RELEASE > /dev/null
             sudo bash /opt/toyquant/deploy/bootstrap_server.sh --repo-dir /opt/toyquant --etc-dir /etc/toyquant
             sudo systemctl daemon-reload
             # The manager's own view is asked and, if needed, repaired -- not assumed from the reload's exit status:
             # measured 2026-11-27, a unit file written a moment before `daemon-reload` was reported `LoadState=loaded`
             # by the bootstrap and then `Unit toyquant-relay.service not found` by the next systemctl call a second
             # later, and `loaded` again a minute after that. So the deploy prints what the manager says on every
             # attempt, re-reloads, and only then touches the units.
             for attempt in $(seq 1 20); do
               states=""
               for unit in toyquant-relay toyquant-live; do
                 state=$(sudo systemctl show -p LoadState --value "$unit" 2>/dev/null || true)
                 states="${states}${states:+, }${unit}=${state:-unknown}"
               done
               if [ "$states" = "toyquant-relay=loaded, toyquant-live=loaded" ]; then
                 break
               fi
               echo "deploy: systemd says [${states}]; reloading (attempt $attempt/20)"
               sudo systemctl daemon-reload
               sleep 1
             done
             if [ "$states" != "toyquant-relay=loaded, toyquant-live=loaded" ]; then
               echo "deploy: systemd still says [${states}] after 20 reloads; the unit files are installed but the" \
                 "manager cannot see them" >&2
               echo "-- evidence, so the next round does not need another one"
               sudo whoami
               sudo ls -l /etc/systemd/system/toyquant-* 2>&1 | head -10
               for unit in toyquant-relay toyquant-live; do
                 sudo systemctl show -p LoadState -p FragmentPath --value "$unit" 2>&1
               done
               sudo systemctl --version 2>&1 | head -1
               systemd-detect-virt 2>&1 || true
               sudo ls -l /etc/systemd/system/multi-user.target.wants/ 2>&1 | head -10
               exit 1
             fi
             echo "deploy: systemd loaded both units [${states}]"
             # **The deploy ships files and verifies them; it restarts nothing that trades.** A restart is a SIGTERM to a
             # session that may be holding quotes, and a redeploy inside the window would therefore leave them at the
             # venue with nothing to cancel them (measured 2026-11-27: 13 s, `stop-sigterm` timed out, SIGKILL, and the
             # quotes stayed). The new binary does not need a restart to reach the next session either: the window timer
             # starts `toyquant-live` at 13:30 UTC every day, so a deploy between windows ships the code and the next open
             # runs it. A hotfix that must land *now* is `--ops restart`, which prints the account before it acts.
             #
             # The relay is **started** (idempotent: a no-op when it is already up) because the preflight's sixth check
             # reads its two sockets, and `Type=simple` reports the unit started before it binds -- hence the wait.
             #
             # A start that answers `Unit ... not found` is the manager saying it has no file to load, and the cached
             # `LoadState=loaded` above is the manager's memory of one that used to be there (measured 2026-11-27, five
             # deploys in a row, twelve milliseconds apart; `reset-failed` and a reload did not change it). So the file
             # is checked and the manager asked for what it actually sees, before and after, rather than the failure
             # being described from memory a second time.
             # The file check runs under `sudo`, like every operation it guards: measured 2026-11-27, a non-sudo `-f` on
             # `/etc/systemd/system/<unit>.service` answered "missing" for a file the manager was loading at the same
             # moment, and the deploy's own diagnostics then described the wrong problem for a round trip.
             for unit in toyquant-relay toyquant-live; do
               if ! sudo test -f "/etc/systemd/system/$unit.service"; then
                 echo "::warning::/etc/systemd/system/$unit.service is not there after the bootstrap; the manager's view follows"
                 echo "deploy: what the bundle carries, the units on the host, and what the tar carries"
                 sudo ls -l "/opt/toyquant/deploy/$unit.service" 2>&1 | head -3 || true
                 sudo ls -l /etc/systemd/system/toyquant-* 2>&1 | head -12 || true
                 sudo tar -tzf /tmp/toyquant-deploy.tar.gz 2>&1 | grep -E '\.service$' | head -8 || true
                 sudo ls -l /opt/toyquant/deploy/ 2>&1 | head -20 || true
               fi
             done
             # The activation is one tracked script, not four lines in this SSH string: a line that travels as a
             # single-quoted argument is parsed twice, and one apostrophe in an echoed sentence closed the argument and
             # killed the step after its diagnostics (measured 2026-11-27). `deploy/activate.sh` reloads, clears the
             # units' state, starts the relay inside a bound, runs the preflight and reports the session without touching
             # it -- and it is one file a reader can run by hand.
             sudo bash /opt/toyquant/deploy/activate.sh --repo-dir /opt/toyquant
          REMOTE

      # A failed health check leaves the previous binary on the host and the previous release one command away. This does
      # not roll back by itself: a rollback that runs unattended can flap a live session, and the operator's decision is
      # what the failure is for.
      - name: Say how to roll back
        if: failure()
        run: |
          echo "::error::the deploy did not come up healthy. On the host: sudo bash /opt/toyquant/deploy/rollback.sh"
