name: ops

# The host's own controls, from a browser: a dispatch menu rather than an SSH session. Nothing here trades by itself --
# `stop` asks the engine to cancel what it holds on the way out, and `flatten` closes what is left at the market with
# `reduceOnly` -- but `restart`, `stop` and `flatten` change a live session, so the workflow is dispatch-only and
# serialised. `ledger` reads the window series; `report` appends a row for a window named by `at` and mails nothing.
on:
  workflow_dispatch:
    inputs:
      action:
        description: what to do on the host
        type: choice
        options:
          - status      # is it up, what does it hold, what does the account hold
          - tail-logs   # the last N journal lines, no state change
          - restart     # preflight, then a graceful restart, then the health check
          - stop        # graceful stop (the engine cancels what it holds), then show what is left
          - flatten     # close the venue's position at the market, reduceOnly, then show what is left
          - diagnose    # why systemd and this repository disagree: the units it knows, and what is on disk
          - preflight   # would tonight's session start? the config, the binary and the sockets, without starting it
          - set-key     # change one instrument-owned setting in live.yaml, with a backup and the flags re-read
          - ledger      # the window series: one row per closed window, as daily_report.py appended it
          - report      # run the report now for the window `at` names: writes the ledger row, mails nothing
        default: status
      lines:
        description: journal lines for tail-logs
        default: "100"
      at:
        description: report only -- the UTC instant whose window to report (empty = now)
        default: ""
      key:
        description: set-key only -- an instrument-owned setting, e.g. engine.ws_seconds
        default: ""
      value:
        description: set-key only -- its new value
        default: ""

concurrency:
  group: ops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # The same three secrets the deploy uses: the host, the account and the key. Nothing about the server is a
      # repository fact.
      - name: Install the key
        run: |
          set -euo pipefail
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > "$HOME/.ssh/deploy_key"
          chmod 0600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> "$HOME/.ssh/known_hosts"

      # The tool an action runs travels with the workflow, not with the host. `/opt/toyquant/tools/` is whatever the last
      # deploy left there, so an action that depended on a fix in `okx_probe.py` could not run until the next deploy --
      # measured 2026-11-27, when two flattens failed for exactly that reason. This is the checked-out copy of the tracked
      # tool, in the deploy account's own name at a fixed path: a sticky `/tmp` is what keeps another account from
      # replacing it before `sudo` runs it.
      - name: Send the account tool
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/deploy_key" -o BatchMode=yes \
            tools/live/okx_probe.py \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/toyquant-okx-probe.py"
          # The config reader travels with the workflow for the same reason: `set-key` must run the allowlist the commit
          # carries, not the one the last deploy left in /opt/toyquant.
          scp -i "$HOME/.ssh/deploy_key" -o BatchMode=yes \
            tools/live/live_config.py \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/toyquant-live-config.py"

      # One step, one SSH session, and the script is the heredoc's: an action that needs `sudo` gets it from the same
      # account the deploy uses, and every branch prints what it did rather than exiting silently.
      - name: Run the action
        env:
          ACTION: ${{ inputs.action }}
          LINES: ${{ inputs.lines }}
          KEY: ${{ inputs.key }}
          VALUE: ${{ inputs.value }}
          AT: ${{ inputs.at }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "ACTION=$ACTION LINES=$LINES KEY=$KEY VALUE=$VALUE AT=$AT bash -s" <<'REMOTE'
          set -uo pipefail
          echo "action=$ACTION host=$(hostname) $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          # The tool is the workflow's own copy (the step above), not the host's: an action must be able to run the fix it
          # was written with. `okx_probe.py` reads the credentials out of `/etc/toyquant/live.env` itself when the
          # environment carries none, which is why `sudo` with no sourced file is the whole invocation.
          TOOL=/tmp/toyquant-okx-probe.py
          # The instrument is the relay's, read from the operator's file: the tool's own default is BTC, and a status
          # that reports another instrument's position is a report about nothing. An empty answer is said out loud
          # rather than silently defaulted.
          INST=$(sudo sed -n 's/^[[:space:]]*\(export[[:space:]]\{1,\}\)\{0,1\}RELAY_INSTRUMENT=//p' \
                   /etc/toyquant/live.env 2>/dev/null | head -1 | tr -d '"\r')
          if [ -z "$INST" ]; then
            echo "no RELAY_INSTRUMENT in /etc/toyquant/live.env: the tool's default instrument is used"
          else
            echo "instrument=$INST (RELAY_INSTRUMENT)"
          fi
          probe() { sudo env INST_ID="${INST:-BTC-USDT-SWAP}" python3 "$TOOL" "$1" 2>&1 | tail -10 || true; }
          case "$ACTION" in
            status)
              for unit in toyquant-relay toyquant-live; do
                printf '%s: %s\n' "$unit" "$(systemctl is-active "$unit" 2>&1)"
                for prop in SubState Result NRestarts ExecMainStatus; do
                  printf '  %s=%s\n' "$prop" "$(systemctl show -p "$prop" --value "$unit" 2>/dev/null)"
                done
              done
              echo '-- account'; probe position; probe pending; probe equity
              echo '-- last five lines each'
              sudo journalctl -u toyquant-live -n 5 --no-pager -q
              sudo journalctl -u toyquant-relay -n 5 --no-pager -q
              ;;
            tail-logs)
              echo "-- toyquant-live, last $LINES"
              sudo journalctl -u toyquant-live -n "$LINES" --no-pager -q
              echo "-- toyquant-relay, last 20"
              sudo journalctl -u toyquant-relay -n 20 --no-pager -q
              ;;
            restart)
              # The relay first, for the same reason the deploy does it: the preflight's sixth check asks whether the two
              # sockets are open, and on a host that is stopped they are not -- so the order is restart the relay, wait for
              # its ports (`Type=simple` reports the unit started before it binds), run the preflight against that relay,
              # then restart the engine and check health. Measured 2026-11-27: the deploy ran the preflight first and a
              # stopped host could not be brought back up at all.
              sudo systemctl reset-failed toyquant-relay toyquant-live || true
              sudo systemctl restart toyquant-relay
              sudo bash /opt/toyquant/deploy/wait_for_ports.sh 127.0.0.1:8765 127.0.0.1:8766
              # The preflight starts the binary, gets the config's arguments, runs the engine to its [Mode] line as the
              # service user (against 127.0.0.1:1, so the relay's single-client order channel is untouched) and compares
              # the endpoints, so a broken artifact is a red action rather than a crash loop.
              sudo bash /opt/toyquant/deploy/preflight.sh
              sudo systemctl restart toyquant-live
              sudo bash /opt/toyquant/deploy/check_health.sh
              ;;
            stop)
              # A graceful stop, not a kill: the engine answers SIGTERM by cancelling what it holds and confirming zero
              # (10 s), and the unit waits 12. Whatever is left afterwards is printed, because the decision to flatten is
              # the operator's -- an action that closed a position a human was holding on purpose is worse than one that
              # says what is still open.
              sudo systemctl stop toyquant-live toyquant-relay
              echo "-- after the stop"; probe pending; probe position
              ;;
            flatten)
              # The tool is the workflow's own copy (the `Send the account tool` step), so this action is versioned with
              # the repository rather than with whatever the last deploy left in `/opt/toyquant/tools`. `flatten` signs one
              # `reduceOnly` market order per open side and prints one answer per order; the two reads after it are the
              # verification, and a non-zero exit is the job's failure rather than a line in a green log.
              #
              # Why this is not an inline python any more: measured 2026-11-27, two flattens failed with the job's last
              # line `action=flatten` and no error at all. A `python3 - <<'PYFLAT'` heredoc sat inside the `<<'REMOTE'`
              # script that is ssh's stdin, indented past where its own delimiter had to start, so its body never reached
              # the interpreter -- a script inside a script is a command nobody can read back.
              if sudo env INST_ID="${INST:-BTC-USDT-SWAP}" python3 "$TOOL" flatten; then
                FLATTEN_STATUS=0
              else
                FLATTEN_STATUS=$?
              fi
              echo "-- after the flatten (flatten exit=$FLATTEN_STATUS)"
              probe position
              probe pending
              probe equity
              exit "$FLATTEN_STATUS"
              ;;
            report)
              # The report on demand: the same file the timer runs, for the window `at` names, with the mail printed
              # instead of sent (`--no-mail`). It writes the ledger row, which is how a window the timer missed is
              # backfilled, and it is how the row's path, the unit's `ReadWritePaths=` sandbox and the scan's grace are
              # checked without waiting for 15:35.
              if [ -n "${AT:-}" ]; then
                sudo -u toyquant /usr/bin/python3 /opt/toyquant/deploy/daily_report.py --no-mail --at "$AT"
              else
                sudo -u toyquant /usr/bin/python3 /opt/toyquant/deploy/daily_report.py --no-mail
              fi
              ;;
            ledger)
              # The window series, read from the host rather than remembered. `daily_report.py` appends one row per closed
              # window after it mails, so this is the only place the series exists between deploys; an empty cell is a
              # line the journal did not carry, never a zero, which is why the header travels with the rows.
              if ! sudo test -f /opt/toyquant/data/runtime/window_ledger.csv; then
                echo "ledger: no file yet -- the report appends the first row after a closed window"
                exit 0
              fi
              sudo head -1 /opt/toyquant/data/runtime/window_ledger.csv
              echo '-- the last twenty windows'
              sudo tail -n 20 /opt/toyquant/data/runtime/window_ledger.csv
              echo "ledger: $(sudo wc -l < /opt/toyquant/data/runtime/window_ledger.csv) line(s) with the header"
              ;;
            set-key)
              # The instrument's own parameters, changed from here rather than by hand in an editor. Three authorities do
              # the refusing: the tool's allowlist (`AGENT_KEYS` -- a size, a loss limit, the seat or an endpoint is the
              # operator's and is refused by name), its parser (a key the engine does not take), and its couplings (the
              # file the engine would start from). The previous file is kept beside the new one, and the flags are re-read
              # so the job log carries what the next session will actually run. A running session is untouched: the file
              # is read at `ExecStartPre`, so the change lands on the next start.
              if [ -z "${KEY:-}" ] || [ -z "${VALUE:-}" ]; then
                echo "set-key needs both key and value" >&2; exit 2
              fi
              sudo python3 /tmp/toyquant-live-config.py --set "$KEY=$VALUE" --file /etc/toyquant/live.yaml
              SET_STATUS=$?
              echo "-- the file now says"
              sudo python3 /tmp/toyquant-live-config.py --check /etc/toyquant/live.yaml
              echo "-- and the next session would run with"
              sudo python3 /tmp/toyquant-live-config.py --flags /etc/toyquant/live.yaml 2>&1 | head -30
              exit "$SET_STATUS"
              ;;
            preflight)
              # The six checks the deploy runs before it restarts anything, on their own: the binary starts, the
              # operator's file translates into the engine's arguments, the engine reaches its `[Mode]` line as the
              # service user (against 127.0.0.1:1, so it cannot take the relay's single order client), the credentials
              # are set, the service user can read both files, and each endpoint the engine dials is the relay's listener
              # and is listening. The relay is started for the sixth check (it only connects to the venue and waits for
              # an engine) and left running; **the engine is not started**, which is what makes this the one question
              # that can be asked all afternoon.
              sudo systemctl start toyquant-relay
              sudo bash /opt/toyquant/deploy/wait_for_ports.sh 127.0.0.1:8765 127.0.0.1:8766
              if sudo bash /opt/toyquant/deploy/preflight.sh; then
                echo "preflight: this host would start tonight's session (the relay is up for it)"
              else
                echo "preflight: the checks above say it would not" >&2
                exit 1
              fi
              ;;
            diagnose)
              # The question a deploy asks when bootstrap says "install toyquant-relay" and the next `systemctl restart`
              # says "Unit toyquant-relay.service not found" (measured 2026-11-27): is the file on disk, is it in the unit
              # search path, and does systemd list it? A unit that exists and is not loaded is a reload or namespace
              # question, and these lines answer it without another round trip.
              echo '-- what systemd knows'
              for unit in toyquant-relay toyquant-live; do
                for prop in LoadState UnitFileState FragmentPath ActiveState Result NRestarts TimeoutStopUSec; do
                  printf '%-16s %-14s %s\n' "$unit" "$prop" "$(systemctl show -p "$prop" --value "$unit" 2>&1)"
                done
              done
              echo '-- what is on disk'
              ls -l /etc/systemd/system/toyquant-* 2>&1 | head -20
              echo '-- the search path and the manager'
              systemctl show -p UnitPath --value 2>&1
              systemctl --version 2>&1 | head -1
              systemd-detect-virt 2>&1 || true
              echo '-- what the file says (first eight lines)'
              head -8 /etc/systemd/system/toyquant-relay.service 2>&1
              echo '-- the report timer, and the zone it fires in'
              sudo systemctl list-timers --all toyquant-report.timer --no-pager 2>&1 | head -4
              timedatectl 2>&1 | head -4
              echo '-- the window timers'
              sudo systemctl list-timers --all toyquant-window-start.timer toyquant-window-stop.timer --no-pager 2>&1 | head -5
              echo '-- what the session will run with'
              sudo python3 /opt/toyquant/tools/live/live_config.py --flags /etc/toyquant/live.yaml 2>&1 | head -30
              echo '-- the daily mail it would send now (a dry run, nothing is mailed)'
              sudo -u toyquant /usr/bin/python3 /opt/toyquant/deploy/daily_report.py --dry-run 2>&1 | head -24
              echo '-- who runs, and as whom'
              whoami; sudo whoami; hostname; date -u '+%Y-%m-%dT%H:%M:%SZ'
              echo '-- is there a manager at all, and can it be written to'
              ps -o comm= -p 1 2>&1
              systemctl is-system-running 2>&1 || true
              which -a systemctl 2>&1
              sudo systemctl reset-failed toyquant-relay 2>&1; echo "reset-failed exit=$?"
              sudo systemctl is-active toyquant-relay 2>&1; echo "is-active exit=$?"
              # `systemctl status` exits 3 for a stopped unit, and a stopped unit is a state this action is asked about,
              # not a failure of the asking: measured 2026-11-27, a diagnose run went red with exit 3 because the session
              # was (deliberately) stopped. The last line makes the branch's status say what actually happened.
              sudo systemctl status toyquant-relay --no-pager 2>&1 | head -5 || true
              echo "diagnose: done -- a stopped unit is a state, not a failure"
              ;;
            *)
              echo "unknown action '$ACTION'" >&2; exit 2
              ;;
          esac
          REMOTE
