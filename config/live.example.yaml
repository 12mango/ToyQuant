# The live configuration, as a template -- copy it to `config/live.yaml`, which is ignored.
#
# `config/live.yaml` is where a symbol list and a size live, and both are trading decisions: a public repository has no
# business carrying either, so the tracked file is this template and nothing else. The values below are the generic test
# defaults -- the demo instrument, one contract a clip, the suppression the frozen configuration carries -- so a file
# copied from this one trades something that costs almost nothing.
#
# `tools/live/live_config.py --flags config/live.yaml` turns the file into the engine's arguments and refuses a key it
# does not know rather than dropping it, because a typo a run silently ignores is a run that trades something other than
# what its file says. The credentials are not here: `.env.example` names the environment variables the relay reads.

engine:
  symbol: BTC-USDT-SWAP          # an example instrument; the seat a session trades belongs in config/live.yaml
  strategy: active_l2
  # quantity_scale: 1000000       # optional positionals, when the file has to name them: 1e6 engine units per unit of
  #                               # the coin, which must equal RELAY_QUANTITY_SCALE in /etc/toyquant/live.env
  # queue_model: prorata
  base_spread_ticks: 3            # the frozen cell's shape: three ticks out, refreshed every tick
  refresh_price_ticks: 1
  order_size: 10000000            # one contract on this instrument's grid
  inventory_limit: 100000000      # ten contracts
  post_only: true
  # The live order leg: `live_orders: true` is what makes the two `link` endpoints below a venue instead of the
  # in-process matcher, and the engine refuses one without it -- so this file is refused by `live_config.py` too, in one
  # sentence rather than on a host as a unit that exits 1 and is restarted. Turning it off is a rehearsal against a
  # simulated venue; the template leaves it on because it is the shape a host actually runs.
  live_orders: true
  advance_debounce_ms: 40000      # forty seconds of book time, the frozen configuration's suppression
  settle_residual: true
  # wind_down_skew_minutes: 15    # only meaningful for a session that ends at a named clock
  # wind_down_end: "15:30"
  # wind_down_skew_ticks: 1       # how far the closing side walks in over the wind-down
  # wind_down_adverse_bps: 15     # start the skew only when the tail is marked against us by this many bps

  # The risk limits, which a live session names rather than inherits: the account's ceiling, the loss that latches the
  # switch, the distance a mispriced order may sit at, and the rate the venue's quota allows. Their defaults are the
  # engine's, and they are written here because a live file that leaves them out is a live file nobody can audit.
  starting_cash: 1000
  max_exposure_usd: 200
  kill_switch_loss_usd: 50
  fat_finger_bps: 200
  max_orders_per_second: 8

  # close_out: true               # flatten at the end of the input (a replay-only control)
  # close_out_cross_bps: 20
  # markout_cover: true           # the adverse-selection gate, when the run has fills to learn from
  # pause_ticks_per_second: 9.0
  # amend_on_toxicity: true
  # amend_deadband_ticks: 2
  # max_depth_ratio: 0.15         # no rung larger than this share of the displayed touch; one rung, no ladder
  # depth_ladder_max: 1

link:
  market_endpoint: 127.0.0.1:8765     # the relay's market-data socket, on the same host
  venue_endpoint: 127.0.0.1:8766      # the relay's order channel (the same relay, --order-listen)
  order_latency_us: 10000             # the measured route is 77 to 118 ms; 10 ms is what the cells were measured at
  cancel_latency_us: 10000
  venue_max_orders: 20                # the adapter's own bound, under the venue's quota
  venue_orders_per_second: 5
  snapshot_out: data/runtime/live-snapshot.json   # the file a restart reconciles from
