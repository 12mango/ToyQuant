# The journal's own ceiling. The engine's files under /opt/toyquant/logs are rotated by deploy/logrotate/toyquant (14
# days, copytruncate); the journal is the one log the session writes without an upper bound, and a 20 GB disk that fills
# takes the host down with it -- including the space `/etc/toyquant` and the snapshot need.
#
#   SystemMaxUse      the whole journal's budget, on disk
#   SystemMaxFileSize one file's, so a busy day cannot be a single unreadable gigabyte
#   MaxRetentionSec   a wall-clock ceiling beside the size one: a quiet host keeps a month, a loud one keeps what fits
#
# Installed by deploy/bootstrap_server.sh as /etc/systemd/journald.conf.d/toyquant.conf. `journalctl --disk-usage`
# prints what is in force; without the drop-in a host inherits the distribution's default of 10% of the filesystem.
[Journal]
SystemMaxUse=500M
SystemMaxFileSize=100M
MaxRetentionSec=30day
