site_name: ToyQuant Docs
site_description: Eight markets closed by numbers, and the C++ instrument that closed them.
site_url: https://12mango.github.io/ToyQuant/
repo_url: https://github.com/12mango/ToyQuant
repo_name: 12mango/ToyQuant

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: slate
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: slate
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - content.code.copy
    - navigation.expand
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - header.autohide

nav:
  - Home: index.md
  - The Core (what and how):
      - User Guide:
          - Modes, flags and data contracts: USER_GUIDE.md
          - 1. Getting started: using/01-getting-started.md
          - 2. Modes: using/02-modes.md
          - 3. The L2 replay:
              - The replay path: using/03-l2-replay.md
              - Run and inputs: using/03-l2-replay/01-the-run-and-its-inputs.md
              - Venue side: using/03-l2-replay/02-the-venue-side.md
              - Funding and what is frozen: using/03-l2-replay/03-funding-and-what-is-frozen.md
          - 4. A live session and the carry line: using/04-live-and-carry.md
          - 5. Scenarios and reports: using/05-scenarios-and-reports.md
          - 6. Reading the output: using/06-reading-the-output.md
          - 7. Troubleshooting: using/07-troubleshooting.md
          - 8. Writing your own strategy: using/08-writing-a-strategy.md
      - Architecture:
          - Design overview: ARCHITECTURE.md
          - System map: architecture/01-system-map.md
          - Inputs and shared types: architecture/02-inputs-and-types.md
          - The coordinator and the book: architecture/03-coordinator-and-book.md
          - The matching engine: architecture/04-matching-engine.md
          - Strategy:
              - The strategy layer: architecture/05-strategy.md
              - The model and the baselines: architecture/05-strategy/01-the-model-and-the-baselines.md
              - The L2 mainline and the comparison: architecture/05-strategy/02-the-l2-mainline.md
          - Accounting and the summary: architecture/06-accounting-and-the-summary.md
      - Main Line: MAINLINE.md
      - Learning Path: LEARNING.md
  - Reference (data and tools):
      - Current performance: PERFORMANCE.md
      - Data files: DATA.md
      - Tools: TOOLS.md
      - L2 replay flags: L2_FLAGS.md
      - Glossary: GLOSSARY.md
  - The Vault (history and decisions):
      - Strategy retrospective: RETROSPECTIVE.md
      - Engine retrospective: LOW_LATENCY.md
      - Architecture decisions (ADR):
          - The rules and the index: adr/index.md
          - 0001. The event stays a variant: adr/0001-the-event-stays-a-variant.md
          - 0002. The order book's map, retired by counting: adr/0002-retire-the-orderbook-map-by-counting.md
          - 0003. Split the gate by what a change pays for: adr/0003-split-the-gate-by-what-a-change-pays-for.md
          - 0004. The document tree keeps its names: adr/0004-the-document-tree-keeps-its-names.md
          - 0005. A live venue is another matching engine: adr/0005-a-live-venue-is-another-matching-engine.md
      - Performance history:
          - All measurements, in order: PERFORMANCE_HISTORY.md
          - 1. The engine and the L1 line: performance/history-01-engine.md
          - 2. The L2 mainline: performance/history-02-l2.md
          - 3. The studies: performance/history-03-studies.md
          - Low-Latency Design: performance/design.md
      - Archived studies: archive/studies.md
      - Research notes: archive/research-notes.md
  - Project meta:
      - Roadmap: ROADMAP.md
      - Design Review: DESIGN_REVIEW.md
      - Document map: MAP.md

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format