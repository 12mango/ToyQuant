site_name: ToyQuant Docs
site_description: Eight markets closed by numbers, and the C++ instrument that closed them.
site_url: https://12mango.github.io/ToyQuant/
repo_url: https://github.com/12mango/ToyQuant
repo_name: 12mango/ToyQuant

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: slate
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: slate
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - content.code.copy
    - navigation.expand
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - header.autohide

nav:
  - Home: index.md
  - Design Review: DESIGN_REVIEW.md
  - Learning Path: LEARNING.md
  - Main Line: MAINLINE.md
  - Roadmap: ROADMAP.md
  - Retrospective: RETROSPECTIVE.md
  - User Guide: USER_GUIDE.md
  - "Using it":
      - "1. Getting started": using/01-getting-started.md
      - "2. Modes": using/02-modes.md
      - "3. The L2 replay":
          - "Overview": using/03-l2-replay.md
          - "1. The run and its inputs": using/03-l2-replay/01-the-run-and-its-inputs.md
          - "2. The venue side": using/03-l2-replay/02-the-venue-side.md
          - "3. Funding and what is frozen": using/03-l2-replay/03-funding-and-what-is-frozen.md
      - "4. A live session and the carry line": using/04-live-and-carry.md
      - "5. Scenarios and reports": using/05-scenarios-and-reports.md
      - "6. Reading the output": using/06-reading-the-output.md
      - "7. Troubleshooting": using/07-troubleshooting.md
  - Architecture: ARCHITECTURE.md
  - "The module reference":
      - "1. System map": architecture/01-system-map.md
      - "2. Inputs and shared types": architecture/02-inputs-and-types.md
      - "3. The coordinator and the book": architecture/03-coordinator-and-book.md
      - "4. The matching engine": architecture/04-matching-engine.md
      - "5. Strategy":
          - "Overview": architecture/05-strategy.md
          - "1. The model and the baselines": architecture/05-strategy/01-the-model-and-the-baselines.md
          - "2. The L2 mainline and the comparison": architecture/05-strategy/02-the-l2-mainline.md
      - "6. Accounting and the summary": architecture/06-accounting-and-the-summary.md
  - Data Files: DATA.md
  - Tools: TOOLS.md
  - Performance:
      - Current numbers: PERFORMANCE.md
      - Low-Latency Design: performance/design.md
      - History: PERFORMANCE_HISTORY.md
      - "History, part 1: the engine and the L1 line": performance/history-01-engine.md
      - "History, part 2: the L2 mainline": performance/history-02-l2.md
      - "History, part 3: the studies": performance/history-03-studies.md
  - Archive:
      - The studies: archive/studies.md
      - Research Notes: archive/research-notes.md
  - Decisions:
      - "What an ADR is, and the rules": adr/index.md
      - "0001. The event stays a variant": adr/0001-the-event-stays-a-variant.md
      - "0002. The order book's map, retired by counting": adr/0002-retire-the-orderbook-map-by-counting.md
      - "0003. Split the gate by what a change pays for": adr/0003-split-the-gate-by-what-a-change-pays-for.md
      - "0004. The document tree keeps its names": adr/0004-the-document-tree-keeps-its-names.md

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format