site_name: ToyQuant-v1 Docs
site_description: Eight markets closed by numbers, and the C++ instrument that closed them.
site_url: https://12mango.github.io/ToyQuant-v1/
repo_url: https://github.com/12mango/ToyQuant-v1
repo_name: 12mango/ToyQuant-v1

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: slate
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: slate
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - content.code.copy
    - navigation.expand
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - header.autohide

nav:
  - Home: index.md
  - Design Review: DESIGN_REVIEW.md
  - Learning Path: LEARNING.md
  - Main Line: MAINLINE.md
  - Roadmap: ROADMAP.md
  - Retrospective: RETROSPECTIVE.md
  - User Guide: USER_GUIDE.md
  - Architecture: ARCHITECTURE.md
  - Performance:
      - Current numbers: PERFORMANCE.md
      - Low-Latency Design: performance/design.md
      - History: PERFORMANCE_HISTORY.md
      - "History, part 1: the engine and the L1 line": performance/history-01-engine.md
      - "History, part 2: the L2 mainline": performance/history-02-l2.md
      - "History, part 3: the studies": performance/history-03-studies.md
  - Archive:
      - The studies: archive/studies.md
      - Research Notes: archive/research-notes.md

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format